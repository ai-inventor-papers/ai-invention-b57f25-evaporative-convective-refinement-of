[project]
name = "scfc-vs-newton-cooling"
version = "1.0.0"
description = "Comparison of Newton's Law of Cooling and Surface-Coupled Fluid Cooling model on coffee cooling datasets"
requires-python = ">=3.12"
dependencies = [
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "kiwisolver==1.5.1",
    "loguru==0.8.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "packaging==26.4",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "scipy==1.18.1",
    "tzdata==2026.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
